[package]
name = "steward"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# gRPC
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
socket2 = { version = "0.6.5", features = ["all"] }

# http
reqwest = { version = "0.13.5", features = ["json"] }

# Database
redis = { version = "1.7.1", features = ["r2d2", "script"] }
r2d2 = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Protobufs
prost = "0.14.4"
prost-types = "0.14.4"

# Reading config from disk
config = "0.15.27"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# Metrics
cadence = "1.8.0"

[build-dependencies]
tonic-prost-build = "0.14.6"
regex = "1.12"
zip = "9.0.0-pre3"
fs_extra = "1.3"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
