name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull-request commits
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check pushed commits
        if: github.event_name == 'push'
        uses: webiny/action-conventional-commits@v1.3.0

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: steward.sbom.cyclonedx.json
      - name: Preserve SBOM
        uses: actions/upload-artifact@v4
        with:
          name: steward-sbom
          path: steward.sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 1

  check:
    name: Check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Test release (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --bin steward
      - name: Run unit tests
        run: cargo test --release --locked --lib --bins
      - name: Package tested release
        run: |
          mkdir release
          cp target/release/steward release/steward
          tar -C release -czf "steward-${{ matrix.arch }}.tar.gz" .
          sha256sum "steward-${{ matrix.arch }}.tar.gz" > "steward-${{ matrix.arch }}.tar.gz.sha256"
      - name: Preserve tested release
        uses: actions/upload-artifact@v4
        with:
          name: steward-${{ matrix.arch }}
          path: |
            steward-${{ matrix.arch }}.tar.gz
            steward-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  integration:
    name: Docker integration tests
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Download tested Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: steward-x86_64
          path: release
      - name: Unpack tested binary
        run: |
          tar -xzf release/steward-x86_64.tar.gz -C release
          mkdir -p target/release
          cp release/steward target/release/steward
      - name: Run integration tests
        run: make test-prebuilt
      - name: Show server logs on failure
        if: failure()
        run: make logs
      - name: Stop Docker environment
        if: always()
        run: make clean

  qualification:
    name: Release qualification harnesses
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - name: Install Redis and protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes redis-server protobuf-compiler
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmark harness
        run: set -o pipefail; cargo run --release --locked --bin bench_harness 2>&1 | tee qualification-benchmarks.log
      - name: Run canary harness
        run: set -o pipefail; cargo run --release --locked --bin canary_harness 2>&1 | tee qualification-canary.log
      - name: Run chaos harness
        run: set -o pipefail; cargo run --release --locked --bin chaos_harness 2>&1 | tee qualification-chaos.log
      - name: Preserve qualification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ github.sha }}
          path: qualification-*.log
          if-no-files-found: warn
          retention-days: 30

  container-scan:
    name: Container security scan
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build release container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/Dockerfile
          load: true
          tags: steward:local
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: steward:local
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  release:
    name: Create draft release
    needs: [commitlint, audit, sbom, check, test, integration, container-scan, qualification]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get released tag
        id: release
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag="$(jq -r '.[0].tag // empty' <<< "$RELEASES")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Prepare release pull request
    needs: [release, commitlint, audit, sbom, check, test, integration, container-scan, qualification]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-binary:
    name: Upload tested Linux binaries and SBOM
    needs: [release, test, integration, sbom, qualification]
    if: always() && needs.test.result == 'success' && needs.integration.result == 'success' && needs.qualification.result == 'success' && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested releases and SBOM
        uses: actions/download-artifact@v4
        with:
          pattern: steward-*
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" steward-*.tar.gz steward-*.tar.gz.sha256 steward.sbom.cyclonedx.json --clobber --repo "$REPOSITORY"

  publish-release:
    name: Publish GitHub release
    needs: [release, upload-binary, publish-container]
    if: always() && needs.upload-binary.result == 'success' && needs.publish-container.result == 'success' && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false

  publish-container:
    name: Publish GitHub container image
    needs: [release, test, integration, container-scan, qualification]
    if: always() && needs.test.result == 'success' && needs.integration.result == 'success' && needs.container-scan.result == 'success' && needs.qualification.result == 'success' && needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
